name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every JS file
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./data/*" \
            -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
